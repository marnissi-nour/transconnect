{% extends "base.html" %}

{% block title %}Changer le mot de passe | TransConnect{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="auth-eyebrow">Sécurité</span>
            <h1>Changer le mot de passe</h1>
            <p>Utilisez un mot de passe unique et difficile à deviner.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button auth-submit" type="submit">Mettre à jour</button>
        </form>
    </div>
</section>
{% endblock %}
