{% extends "base.html" %}

{% block title %}Mot de passe modifié | TransConnect{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="auth-eyebrow">Sécurité</span>
            <h1>Mot de passe mis à jour</h1>
            <p>Votre compte est maintenant protégé avec votre nouveau mot de passe.</p>
        </div>
        <a class="button auth-submit" href="{% url 'dashboard' %}">
            Retour au dashboard
        </a>
    </div>
</section>
{% endblock %}
