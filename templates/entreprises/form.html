{% extends "base.html" %}

{% block title %}Entreprise{% endblock %}

{% block content %}
<div class="content-card form-card">
    <h1>Créer ou modifier une entreprise</h1>
    <p>Ajoutez un partenaire de confiance à TransConnect.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button" type="submit">Enregistrer</button>
            <a class="button button-secondary" href="{% url 'entreprises:liste' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
