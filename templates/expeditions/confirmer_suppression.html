{% extends "base.html" %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<h1>Confirmer la suppression</h1>
<p>Voulez-vous vraiment supprimer l'expédition « {{ objet }} » ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer</button>
</form>
<a href="{% url 'expeditions:liste' %}">Annuler</a>
{% endblock %}
