{% extends "base.html" %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="content-card form-card danger-card">
    <h1>Supprimer l'offre</h1>
    <p>Voulez-vous vraiment supprimer « {{ objet }} » ? Cette action est irréversible.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button button-danger" type="submit">Confirmer la suppression</button>
            <a class="button button-secondary" href="{% url 'offres:liste' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
