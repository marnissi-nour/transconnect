{% extends "base.html" %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<h1>Confirmer la suppression</h1>
<p>Voulez-vous vraiment supprimer le véhicule « {{ objet }} » ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer</button>
</form>
<a href="{% url 'vehicules:liste' %}">Annuler</a>
{% endblock %}
