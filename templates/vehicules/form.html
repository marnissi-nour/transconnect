{% extends "base.html" %}

{% block title %}Ajouter un véhicule{% endblock %}

{% block content %}
<div class="content-card form-card">
    <h1>Ajouter ou modifier un véhicule</h1>
    <p>Enregistrez un véhicule disponible pour vos opérations de transport.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button" type="submit">Enregistrer</button>
            <a class="button button-secondary" href="{% url 'vehicules:liste' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
